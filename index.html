<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172554" />
  <title>E-Card • Student Conduct & Permission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div><strong>E-Card</strong><span>Student conduct hub</span></div>
      </div>
      <div class="role-switcher">
        <button class="role-btn active" data-role="admin">Administration</button>
        <button class="role-btn" data-role="student">Student portal</button>
      </div>
      <nav id="navAdmin" class="side-nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Overview</button>
        <button class="nav-item" data-view="students"><span>◎</span> Students</button>
        <button class="nav-item" data-view="marks"><span>＋</span> Add / remove marks</button>
        <button class="nav-item" data-view="permissions"><span>▣</span> Permission cards</button>
        <button class="nav-item" data-view="reports"><span>◫</span> Reports</button>
      </nav>
      <nav id="navStudent" class="side-nav hidden">
        <button class="nav-item active" data-view="student-home"><span>⌂</span> My dashboard</button>
        <button class="nav-item" data-view="history"><span>↕</span> Mark history</button>
        <button class="nav-item" data-view="my-permissions"><span>▣</span> My permission cards</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> School system online</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuBtn">☰</button>
        <div><p class="eyebrow" id="pageEyebrow">ADMINISTRATION</p><h1 id="pageTitle">Good afternoon, Admin</h1></div>
        <div class="top-actions"><button class="icon-btn" title="Notifications">♢<i></i></button><div class="avatar">AD</div></div>
      </header>

      <section id="appContent"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
